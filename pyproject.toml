[project]
name = "grabnes-docs"
version = "0.1"
description = "Documentation site for the GRABNES tight-binding code"
requires-python = ">=3.10"
dependencies = [
    "sphinx>=7.4",
    "furo>=2024.8",
    "myst-parser>=3.0",
    "sphinx-design>=0.6",
    "ford>=7.0.13",
    "gitpython>=3.1",
    "sphinx-copybutton>=0.5.2",
    "nbsphinx>=0.9.8",
    "pypandoc-binary>=1.17",
    "ipython>=8.39.0",
]

[tool.uv]
# Documentation-only project: uv sync builds the environment, not a package.
package = false
