# Keeps the site in step with the GRABNES code repository.
#
# Twice a day (and on demand) this looks for the newest commit on main of
# gjung-group/grabnes whose `regression` workflow passed. If it is newer than
# the commit recorded in tools/sync-state.json, the site is synced to it:
#
#   - clean sync (no MANUAL items) and the -W build passes
#       -> committed to main and deployed (docs.yml is dispatched, because a
#          push made with GITHUB_TOKEN does not trigger other workflows);
#   - MANUAL items (hand-written pages whose upstream source changed) or a
#     failing build (e.g. a new page missing from a toctree)
#       -> pushed to the branch sync/upstream and opened as a pull request for
#          review. No further sync runs while that pull request is open.
#
# Commits that failed, were cancelled or are still running are never synced.
name: sync-upstream

on:
  schedule:
    - cron: "17 5,17 * * *"   # twice a day, 05:17 and 17:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: gjung-group/grabnes
  BRANCH: sync/upstream
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the newest upstream commit that passed the tests
        id: upstream
        run: |
          open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            echo "::notice::Sync pull request #$open_pr is still open; merge or close it first."
            echo "new=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          sha=$(gh api "repos/$UPSTREAM/actions/workflows/regression.yml/runs?branch=main&event=push&status=success&per_page=1" \
                  --jq '.workflow_runs[0].head_sha // empty')
          synced=$(jq -r .commit tools/sync-state.json)
          if [ -z "$sha" ]; then
            echo "::warning::No passing regression run found on $UPSTREAM main."
            echo "new=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          git clone -q "https://github.com/$UPSTREAM.git" "$RUNNER_TEMP/grabnes"
          git -C "$RUNNER_TEMP/grabnes" checkout -q --detach "$sha"
          # Nothing to do if the tested commit is the synced one or older.
          if git -C "$RUNNER_TEMP/grabnes" merge-base --is-ancestor "$sha" "$synced" 2>/dev/null; then
            echo "Up to date: newest tested commit ${sha:0:7}, synced ${synced:0:7}."
            echo "new=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Syncing ${synced:0:7} -> ${sha:0:7}"
          git -C "$RUNNER_TEMP/grabnes" log --oneline "$synced..$sha" | tee "$RUNNER_TEMP/commits.txt"
          {
            echo "new=true"
            echo "sha=$sha"
            echo "short=${sha:0:7}"
          } >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5
        if: steps.upstream.outputs.new == 'true'
        with:
          python-version: "3.12"

      - name: Sync the mirrored files
        id: sync
        if: steps.upstream.outputs.new == 'true'
        run: |
          set -o pipefail
          uv sync
          uv run python tools/sync_from_code_repo.py --src "$RUNNER_TEMP/grabnes" 2>&1 | tee "$RUNNER_TEMP/sync.log"
          short=${{ steps.upstream.outputs.short }}
          sed -i -E "s/upstream commit \`[0-9a-f]{7}\`/upstream commit \`$short\`/" README.md
          sed -i -E "s/Last synced: \`[0-9a-f]{7}\`/Last synced: \`$short\`/" CLAUDE.md
          if grep -q MANUAL "$RUNNER_TEMP/sync.log"; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
          else
            echo "manual=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site (warnings are errors)
        id: build
        if: steps.upstream.outputs.new == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          uv run sphinx-build -b html -W --keep-going . "$RUNNER_TEMP/site" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit to main and deploy, or open a pull request
        if: steps.upstream.outputs.new == 'true'
        run: |
          short=${{ steps.upstream.outputs.short }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          {
            echo "Sync site with upstream main $short"
            echo
            echo "Automatic sync to $UPSTREAM@$short (regression tests passed)."
            echo "Upstream commits:"
            echo
            cat "$RUNNER_TEMP/commits.txt"
          } > "$RUNNER_TEMP/msg.txt"
          git commit -q -F "$RUNNER_TEMP/msg.txt"

          if [ "${{ steps.sync.outputs.manual }}" = "false" ] && [ "${{ steps.build.outcome }}" = "success" ]; then
            git push origin HEAD:main
            gh workflow run docs.yml --ref main
            echo "::notice::Synced to $short and deployed."
            exit 0
          fi

          git push -f origin "HEAD:refs/heads/$BRANCH"
          {
            echo "Automatic sync to \`$UPSTREAM@$short\` needs review:"
            echo
            [ "${{ steps.sync.outputs.manual }}" = "true" ] && \
              echo "- **MANUAL**: hand-written pages derived from changed upstream files must be updated by hand (see the sync output)."
            [ "${{ steps.build.outcome }}" != "success" ] && \
              echo "- **Build failed** with \`-W\` (see the build output; a new page may need a toctree entry)."
            echo
            echo "Push the fixes to \`$BRANCH\`, then merge."
            echo
            echo "<details><summary>Upstream commits</summary>"; echo; echo '```'; cat "$RUNNER_TEMP/commits.txt"; echo '```'; echo "</details>"
            echo
            echo "<details><summary>Sync output</summary>"; echo; echo '```'; grep -v -E 'Parsing files|Warning: Can not find include' "$RUNNER_TEMP/sync.log" || true; echo '```'; echo "</details>"
            echo
            echo "<details><summary>Build output (last 40 lines)</summary>"; echo; echo '```'; tail -n 40 "$RUNNER_TEMP/build.log"; echo '```'; echo "</details>"
          } > "$RUNNER_TEMP/pr.md"
          gh pr create --base main --head "$BRANCH" \
            --title "Sync site with upstream main $short" --body-file "$RUNNER_TEMP/pr.md"
          echo "::warning::Sync to $short needs review; pull request opened."
